<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="theme-color" content="#74bf4b" />
    <title>Farm Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
    <section class="screen-overlay main-menu" aria-label="Main menu">
      <h1>Farm Game</h1>
      <button class="menu-button play-button" type="button">Play</button>
    </section>
    <main class="game" aria-label="Farm game" hidden>
      <section class="board-layout">
        <aside class="resource-pool player-one-pool" aria-label="Player 1 resources">
          <div class="resource-list"></div>
        </aside>
        <div class="upgrade-slots player-one-upgrade-slots" aria-hidden="true">
          <span class="upgrade-slot"></span>
          <span class="upgrade-slot"></span>
        </div>

        <div class="center-stack">
          <section class="shop-board" aria-label="Shop">
            <h2>Shop <span class="shop-refresh-count" aria-label="10 turns until shop refresh">10</span></h2>
            <div class="shop-list">
              <div class="shop-card" data-item="weed-killer" role="button" tabindex="0"></div>
              <div class="shop-card" data-item="fertiliser" role="button" tabindex="0"></div>
              <div class="shop-card" data-item="water-upgrade" role="button" tabindex="0"></div>
              <div class="shop-card" data-item="harvest-upgrade" role="button" tabindex="0"></div>
            </div>
          </section>

          <section class="farm-grid" aria-label="Farm plots"></section>

          <section class="order-board" aria-label="Orders">
            <h2><button class="order-round-count" type="button" aria-label="Round 1" aria-expanded="false">1</button> Orders <span class="order-refresh-count" aria-label="20 turns until order refresh">20</span></h2>
            <div class="order-list"></div>
          </section>
        </div>

        <aside class="resource-pool player-two-pool" aria-label="Player 2 resources">
          <div class="resource-list"></div>
        </aside>
        <div class="upgrade-slots player-two-upgrade-slots" aria-hidden="true">
          <span class="upgrade-slot"></span>
          <span class="upgrade-slot"></span>
        </div>
      </section>

      <section class="action-dock player-one-dock" aria-label="Turn actions">
        <div class="tool-tray">
          <button class="tool-button" data-tool="water" type="button" aria-pressed="false">
            <span class="tool-name">Water</span>
            <span class="tool-icons water-icons" aria-hidden="true"></span>
          </button>
          <button class="tool-button" data-tool="cut" type="button" aria-pressed="false">
            <span class="tool-name">Harvest</span>
            <span class="tool-icons cut-icons" aria-hidden="true"></span>
          </button>
        </div>
        <button class="next-turn" type="button">Next Turn</button>
      </section>

      <div class="turn-announcement player-one" role="status" aria-live="polite" hidden>
        Player 1's Turn!
      </div>
    </main>

    <section class="screen-overlay victory-screen" aria-label="Victory" hidden>
      <h1><span class="victory-player"></span> Wins!</h1>
      <div class="victory-summary"></div>
      <button class="menu-button return-menu-button" type="button">Return to Main Menu</button>
    </section>

    <script src="js/game-data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game-state.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/resources.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/farm.js"></script>
    <script src="js/turns.js"></script>
    <script src="js/game.js"></script>
    <script>
      if (screen.orientation?.lock) {
        screen.orientation.lock("landscape").catch(() => {});
      }
    </script>
    </div>
  </body>
</html>
